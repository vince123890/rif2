<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.85; }
  </style>
</helmet>
<div style="font-family:'Inter',sans-serif; background:#F4F5F7; padding:64px 24px; display:flex; flex-direction:column; gap:72px; align-items:center;">
  <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
    <div style="width:100%; max-width:1080px; display:flex; flex-direction:column; align-items:center; gap:24px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="{{ sec.leafStyle }}"></span>
        <h2 style="margin:0; font-family:'Poppins',sans-serif; font-weight:700; font-size:24px; color:#F0821E; letter-spacing:0.2px;">{{ sec.title }}</h2>
        <span style="{{ sec.leafStyle }}"></span>
      </div>

      <div style="width:100%; overflow:hidden; padding:6px 0 8px;">
        <div style="{{ sec.trackStyle }}">
          <sc-for list="{{sec.items}}" as="item" hint-placeholder-count="5">
            <div style="{{ item.cardStyle }}" onClick="{{ item.onClick }}">
              <div style="background:#EAEAEC; border-radius:14px 14px 0 0; height:210px; padding:20px; position:relative; overflow:hidden; box-sizing:border-box;">
                <div style="display:flex; align-items:center; gap:6px; position:relative; z-index:1;">
                  <span style="width:16px; height:16px; border-radius:50%; background:#1E7145; display:inline-block; flex-shrink:0;"></span>
                  <span style="font-family:'Inter',sans-serif; font-size:11px; font-weight:600; color:#1E7145;">Resona Indonesia Finance</span>
                </div>
                <div style="{{ item.titleStyle }}">
                  <sc-for list="{{item.lines}}" as="line" hint-placeholder-count="2">
                    <div>{{ line }}</div>
                  </sc-for>
                </div>
                <div style="position:absolute; right:-10px; bottom:-30px; font-family:'Poppins',sans-serif; font-weight:800; font-size:110px; color:#1E7145; opacity:0.12; z-index:0; line-height:1;">R</div>
              </div>
              <div style="background:#FFFFFF; border-radius:0 0 14px 14px; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box;">
                <span style="font-family:'Inter',sans-serif; font-weight:600; font-size:15px; color:#2B2B2B;">{{ item.year }}</span>
                <a href="{{ item.href }}" style="background:#1E7145; color:#FFFFFF; font-family:'Inter',sans-serif; font-weight:600; font-size:13px; padding:8px 20px; border-radius:999px; display:inline-block;">Detail</a>
              </div>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:16px;">
        <button onClick="{{ sec.prev }}" style="width:36px; height:36px; border-radius:50%; background:#1E7145; border:none; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">&#8249;</button>
        <div style="display:flex; align-items:center; gap:8px;">
          <sc-for list="{{sec.dots}}" as="dot" hint-placeholder-count="5">
            <span style="{{ dot.style }}"></span>
          </sc-for>
        </div>
        <button onClick="{{ sec.next }}" style="width:36px; height:36px; border-radius:50%; background:#1E7145; border:none; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">&#8250;</button>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { active: { sustainability: 0, annual: 0 } };

  select(sectionId, idx) {
    if (this.state.active[sectionId] === idx) return;
    this.setState(s => ({ active: { ...s.active, [sectionId]: idx } }));
  }

  shift(sectionId, dir, len) {
    this.setState(s => {
      let next = (s.active[sectionId] + dir + len) % len;
      return { active: { ...s.active, [sectionId]: next } };
    });
  }

  renderVals() {
    const ACTIVE_W = 300, INACTIVE_W = 200, GAP = 20;
    const data = [
      {
        id: 'sustainability',
        title: 'Sustainability Report',
        items: [
          { year: '2025', lines: ['SUSTAINABILITY', 'REPORT'] },
          { year: '2024', lines: ['SUSTAINABILITY', 'REPORT'] },
          { year: '2023', lines: ['SUSTAINABILITY', 'REPORT'] },
          { year: '2022', lines: ['SUSTAINABILITY', 'REPORT'] },
          { year: '2021', lines: ['SUSTAINABILITY', 'REPORT'] },
        ],
      },
      {
        id: 'annual',
        title: 'Annual Report',
        items: [
          { year: '2025', lines: ['ANNUAL', 'REPORT'] },
          { year: '2024', lines: ['ANNUAL', 'REPORT'] },
          { year: '2023', lines: ['ANNUAL', 'REPORT'] },
        ],
      },
    ];

    const sections = data.map(sec => {
      const active = this.state.active[sec.id] ?? 0;
      let offset = 0;
      for (let i = 0; i < active; i++) offset += INACTIVE_W + GAP;

      const items = sec.items.map((it, idx) => {
        const isActive = idx === active;
        return {
          year: it.year,
          lines: it.lines,
          href: 'Report Detail.dc.html?section=' + encodeURIComponent(sec.title) + '&year=' + it.year,
          onClick: () => this.select(sec.id, idx),
          cardStyle: {
            flex: isActive ? '0 0 ' + ACTIVE_W + 'px' : '0 0 ' + INACTIVE_W + 'px',
            filter: isActive ? 'none' : 'saturate(0.6) opacity(0.85)',
            transition: 'flex-basis 0.45s cubic-bezier(.22,.9,.35,1), filter 0.45s ease',
            borderRadius: '14px',
            boxShadow: isActive ? '0 12px 28px rgba(0,0,0,0.10)' : '0 4px 10px rgba(0,0,0,0.05)',
            cursor: 'pointer',
            overflow: 'hidden',
          },
          titleStyle: {
            marginTop: '18px',
            position: 'relative',
            zIndex: 1,
            fontFamily: "'Poppins',sans-serif",
            fontWeight: 800,
            fontSize: isActive ? '22px' : '16px',
            lineHeight: 1.2,
            color: isActive ? '#F0821E' : '#D8A87C',
            transition: 'font-size 0.45s ease, color 0.45s ease',
          },
        };
      });

      return {
        id: sec.id,
        title: sec.title,
        leafStyle: { width: '20px', height: '20px', borderRadius: '50%', background: '#1E7145', display: 'inline-block' },
        items,
        trackStyle: {
          display: 'flex',
          gap: GAP + 'px',
          transition: 'transform 0.5s cubic-bezier(.22,.9,.35,1)',
          transform: 'translateX(-' + offset + 'px)',
        },
        dots: sec.items.map((_, i) => ({
          style: {
            width: '8px', height: '8px', borderRadius: '50%',
            background: i === active ? '#1E7145' : '#D9D9D9',
            transition: 'background 0.3s ease',
          },
        })),
        prev: () => this.shift(sec.id, -1, sec.items.length),
        next: () => this.shift(sec.id, 1, sec.items.length),
      };
    });

    return { sections };
  }
}
</script>
</body>
</html>
